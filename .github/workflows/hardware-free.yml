name: hardware-free checks

# Runs Python safety checks and verifies the committed frontend bundle on pushes
# to main and on same-repo pull requests. No physical G1 or Xsens hardware is
# required. The job needs a self-hosted runner that carries the pinned GMR
# workspace (repository variable MOCAP_WS), so it is deliberately not
# triggered by fork pull requests or by pushes to arbitrary branches.
#
# The Python suite runs on 3.10, 3.11 and 3.12 (pyproject requires >=3.10).
# Dependencies are pinned by constraints/requirements-ci.txt, a universal
# (marker-split) file shared by all three legs; refresh it with
# `make constraints`. Frontend, bundle and audit steps run once, on the 3.11 leg.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hardware-free-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hardware-free-checks:
    name: hardware-free-checks (py${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One self-hosted machine: legs share ports (UDP loopback tests), the GMR
      # workspace and the GPU/EGL stack, so run them serially.
      max-parallel: 1
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Any skipped test fails the run (see tests/conftest.py).
      MOCAP_REQUIRE_ALL_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Require the GMR workspace
        env:
          MOCAP_WS: ${{ vars.MOCAP_WS }}
        run: |
          if [ -z "$MOCAP_WS" ]; then
            echo "::error::vars.MOCAP_WS is empty; the MuJoCo gate tests would skip"
            exit 1
          fi
          model="$MOCAP_WS/GMR/assets/unitree_g1/g1_mocap_29dof.xml"
          if [ ! -f "$model" ]; then
            echo "::error::MOCAP_WS is missing GMR/assets/unitree_g1/g1_mocap_29dof.xml ($model)"
            exit 1
          fi

      # Conservative headless GL support for current and future MuJoCo checks.
      # Skip sudo entirely when the self-hosted runner already has the packages.
      - name: Install headless GL libraries
        run: |
          dpkg -s libgl1 libegl1 libosmesa6 >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libgl1 libegl1 libosmesa6
          }

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/requirements-ci.txt -e '.[runtime,operator,test,lint]'

      - name: make hardware-free-checks
        env:
          MUJOCO_GL: egl
          # Absolute path to the pinned GMR runtime on the self-hosted runner.
          # Verified non-empty above; MOCAP_REQUIRE_ALL_TESTS turns any
          # remaining skip into a failure.
          MOCAP_WS: ${{ vars.MOCAP_WS }}
          # Report-only coverage (no threshold) for the library and eval harness.
          PYTEST_ARGS: --cov=mocap_g1 --cov=eval --cov-report=term --cov-report=xml:coverage.xml
        run: make hardware-free-checks

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      # Known-vulnerability audit of the exact pinned set (not the runner's
      # site-packages). pip-audit queries PyPI advisories, so it needs network.
      - name: pip-audit (pinned Python dependencies)
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit -r constraints/requirements-ci.txt --no-deps --disable-pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.python-version == '3.11'
        with:
          node-version-file: operator_ui/.nvmrc
          cache: npm
          cache-dependency-path: operator_ui/package-lock.json

      - name: Install frontend dependencies
        if: matrix.python-version == '3.11'
        run: npm ci
        working-directory: operator_ui

      - name: npm audit (production dependencies)
        if: matrix.python-version == '3.11'
        run: npm audit --omit=dev --audit-level=high
        working-directory: operator_ui

      - name: Lint, typecheck, test and build frontend
        if: matrix.python-version == '3.11'
        run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: operator_ui

      # git diff alone ignores untracked files, so a new hashed asset that was
      # built but never committed would slip through; porcelain status catches both.
      - name: Verify committed frontend bundle
        if: matrix.python-version == '3.11'
        run: |
          git diff --exit-code -- mocap_g1/operator/static
          if [ -n "$(git status --porcelain -- mocap_g1/operator/static)" ]; then
            echo "::error::mocap_g1/operator/static is out of date (changed or untracked files after the build); commit the rebuilt bundle"
            git status --porcelain -- mocap_g1/operator/static
            exit 1
          fi
