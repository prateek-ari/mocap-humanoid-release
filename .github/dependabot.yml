version: 2
updates:
  # Python: pyproject.toml ranges plus the CI constraints file. Dependabot edits
  # single pins in constraints/requirements-ci.txt; regenerate it with
  # `make constraints` before merging so marker-split pins stay consistent.
  - package-ecosystem: pip
    directories:
      - "/"
      - "/constraints"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/operator_ui"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
